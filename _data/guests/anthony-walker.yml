name: "Anthony Walker"
title: "Managing Partner"
firm: "Next Coast Legacy"
bio: "Anthony Walker is a Managing Partner at Next Coast Legacy, an ETA private equity firm focused on the lower-middle-market. He advises ETA searchers on how to navigate the investor underwriting process, emphasizing that sponsorship decisions are collaborative rather than unilateral. Walker is also a leading voice on lower-middle-market opportunities in the Business Process Outsourcing sector, stressing the importance of recurring revenue, niche specialization, and AI readiness."
topics:
  - Investor decision-making in ETA deal underwriting
  - Red flags that cause sponsors to pass on a deal
  - Business Process Outsourcing as an ETA target sector
  - Revenue quality and customer concentration risks
  - Gross margin thresholds for lower-middle-market BPO companies
  - Post-acquisition growth strategies for BPO businesses
episodeTitle: "Why would an ETA searcher's financial sponsor say no to a deal?"
episodeUrl: "https://searchpartychannel.substack.com/p/why-would-an-eta-searchers-financial"

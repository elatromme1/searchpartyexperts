name: "Keith Burns"
title: "CEO"
firm: "CyberData Pros"
bio: "Keith Burns is the CEO of CyberData Pros, having acquired the company from its founder after a career acquiring and operating small businesses in the lower middle market. His experience watching cybersecurity become a critical blind spot for ETA-backed operators inspired him to bring CyberData Pros into his portfolio. On Search Party, Keith explains why cybersecurity is no longer a luxury for small businesses — it is a core business protection equivalent to property insurance — and why the AI era has made the threat more immediate and unpredictable than ever."
topics:
  - Why lower middle market businesses are increasingly targeted by cyber attacks
  - How AI has dramatically lowered the cost and effort of cybercrime
  - Why newly announced PE-backed acquisitions are frequent attack targets
  - Cybersecurity as a valuation and exit readiness issue
  - What buyers discover in security audits during M&A due diligence
  - The business case for investing in cybersecurity certifications like SOC 2 and CMMC
  - Comparing cybersecurity investment to standard business insurance
episodeTitle: "Without Cybersecurity, Small Businesses Can Get a Lot Smaller"
episodeUrl: "https://searchpartychannel.substack.com/p/without-cybersecurity-small-businesses"

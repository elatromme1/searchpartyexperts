name: "A.J. Wasserstein"
title: "Senior Lecturer in the Practice of Management"
firm: "Yale School of Management"
bio: "A.J. Wasserstein is a Senior Lecturer at the Yale School of Management, where he teaches entrepreneurship through acquisition and is one of the foremost academic authorities on the ETA model. A former searcher himself, A.J. brings rigorous data and practitioner credibility to his analysis of how the search fund ecosystem is evolving. On Search Party, he joins a panel discussion on how ETA investors are faring in the current environment, offering honest assessments of what the data says about returns, risks, and the state of the market."
topics:
  - Academic research on ETA search fund returns and performance trends
  - How the ETA investor community is performing in today's market
  - What the data reveals about search fund success rates and failure modes
  - Historical context for the current wave of ETA deal activity
  - What MBA programs are teaching the next generation of ETA operators
  - The evolution of the search fund model from niche strategy to mainstream asset class
  - How experienced investors and new entrants are approaching ETA differently
episodeTitle: "How Are ETA Investors Really Faring?"
episodeUrl: "https://searchpartychannel.substack.com/p/how-are-eta-investors-really-faring-1ad"

name: "Jonathan Taylor"
title: "CEO"
firm: "AEK Technology"
bio: "Jonathan Taylor is the CEO of AEK Technology, a small defense contractor that has been navigating the increasingly rigorous cybersecurity certification requirements imposed by government customers. On Search Party, Jonathan offers a customer's perspective on what cybersecurity investment really means at the small business level — not as a tech expense, but as a prerequisite for winning contracts and preserving revenue. His firsthand account of CMMC compliance illuminates the real-world stakes for lower middle market operators in regulated industries."
topics:
  - Why government contractors must invest in cybersecurity certifications to compete
  - CMMC compliance and what it means for small defense businesses
  - How failing to meet cyber standards costs companies real revenue opportunities
  - The practical experience of pursuing SOC 2 and ISO 27001 certifications
  - Balancing cybersecurity investment with the financial constraints of small businesses
  - How cyber requirements are cascading down from large primes to small vendors
  - Working with specialized cybersecurity partners as a small operator
episodeTitle: "Without Cybersecurity, Small Businesses Can Get a Lot Smaller"
episodeUrl: "https://searchpartychannel.substack.com/p/without-cybersecurity-small-businesses"

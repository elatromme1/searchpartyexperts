name: "Burton Francis"
title: "Managing Director"
firm: "ECA Partners"
bio: "Burton Francis is a Managing Director at ECA Partners, an executive search firm focused on the lower middle market. He brings a talent and leadership lens to the ETA conversation, helping searchers and their investors think about how operational expertise, industry fit, and talent acquisition intersect with long-term value creation. On Search Party, Burton challenges common assumptions about vertical specialization and explains what really distinguishes high-performing ETA operators."
topics:
  - Whether ETA searchers should focus on sub-verticals they have worked in
  - How to develop industry fluency quickly as a first-time CEO
  - The importance of pattern recognition in unfamiliar markets
  - Building credibility with legacy management teams
  - Using advisors and mentors to supplement operator expertise
  - What investors look for in talented ETA operators
  - Evaluating executive talent for lower middle market businesses
episodeTitle: "Should ETA Searchers Stick to Sub-Verticals They've Worked In?"
episodeUrl: "https://searchpartychannel.substack.com/p/should-eta-searchers-stick-to-sub"

bio: "Dustin Sellers is a Managing Partner at NCL Partners (Next Coast Legacy), one of the most active ETA search fund investors in the market. A former searcher himself, Dustin is one of Search Party's most frequent guests and panel participants, offering an investor's perspective on everything from deal sizing and search strategy to operator compensation and exit markets. His candid commentary on what separates successful ETA searchers from the rest makes him a go-to voice in the ecosystem."
topics:
  - How ETA search is entering a new era of larger and more complex deals
  - NCL's criteria for evaluating prospective searchers
  - Executive compensation design tied to EBITDA performance
  - Current exit market conditions for ETA-backed businesses
  - The case for partnered search versus solo search
  - When ETA investors are really faring in today's market
  - Value creation playbooks for lower middle market CEOs
episodeTitle: "ETA Search Has Entered Its Fourth Turning"

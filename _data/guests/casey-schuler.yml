name: "Casey Schuler"
title: "CEO"
firm: "PalCare"
bio: "Casey Schuler is the CEO of PalCare, a healthcare technology platform that powers nurse-call and emergency alert systems for assisted living and memory care communities. Casey and his business school friend Hutson Prioleau acquired PalCare in late 2019 — just months before COVID-19 shut down senior living facilities across the country. On Search Party, Casey shares how he and Hutson survived an 80% revenue halt, cut costs aggressively, automated their systems, and emerged as a stronger, more resilient company. His story is one of the most vivid illustrations of ETA ownership under pressure."
topics:
  - Navigating a major COVID-19 business crisis within months of acquisition close
  - The power of partnered search and complementary skill sets between co-CEOs
  - How a shared trust between partners enables faster, tougher decisions
  - Rebuilding revenue through operational pivots and new go-to-market strategies
  - Transitioning from survival mode to a growth and scale mindset
  - Building a COO and CRO leadership layer after years of founder-operated growth
  - Why choosing your industry matters as much as finding a good deal
episodeTitle: "Two Friends Became ETA Searchers and, Miraculously, Are Still Friends"
episodeUrl: "https://searchpartychannel.substack.com/p/copy-two-friends-became-eta-searchers"

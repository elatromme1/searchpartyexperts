name: "Hutson Prioleau"
title: "President"
firm: "PalCare"
bio: "Hutson Prioleau is the President of PalCare, a healthcare technology company he co-acquired with CEO Casey Schuler in 2019. A former college football player and Texas A&M grad, Hutson brings sales instincts and relentless relationship-building energy to the partnership. On Search Party, Hutson discusses how a shared entrepreneurial vision with his best friend became a real business, how they survived the COVID crisis that hit within three months of owning PalCare, and how the partnership model amplified their individual strengths throughout one of the most challenging early ownership periods in recent ETA history."
topics:
  - How college friendship and shared ambition translates into a strong ETA partnership
  - Sales-driven leadership and how to win customers in a niche market
  - Using a proprietary outreach system alongside relationship-based deal sourcing
  - How COVID forced faster operational improvements than originally planned
  - Expanding revenue channels by transitioning from distributors to direct sales
  - What partnered searchers look for in complementary skill sets
  - Evaluating businesses through the lens of operator-market fit and personal passion
episodeTitle: "Two Friends Became ETA Searchers and, Miraculously, Are Still Friends"
episodeUrl: "https://searchpartychannel.substack.com/p/copy-two-friends-became-eta-searchers"

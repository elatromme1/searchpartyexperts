name: "Daniel Lazier"
title: "Co-Founder"
firm: "Skyline Crest Partners"
bio: "Daniel Lazier is the Co-Founder of Skyline Crest Partners, an ETA-focused investment firm. On Search Party, Daniel joins a panel with A.J. Wasserstein and Dustin Sellers to examine how ETA investors are genuinely performing in today's market — cutting through the optimism to discuss where returns are being made, where capital has been lost, and how the investor community is adapting to a more competitive and complex deal environment. His practitioner perspective adds ground-level texture to a high-level asset class discussion."
topics:
  - Current state of ETA investor returns in a competitive market
  - How to evaluate searcher quality from an investor's vantage point
  - Capital deployment strategy in a market with rising deal prices
  - What distinguishes the best ETA investors from the average
  - Portfolio company challenges that affect investor returns
  - Balancing support for operators with financial discipline as an investor
  - How the ETA ecosystem has matured from an investor's perspective
episodeTitle: "How Are ETA Investors Really Faring?"
episodeUrl: "https://searchpartychannel.substack.com/p/how-are-eta-investors-really-faring-1ad"

name: "Conor Tidgwell"
title: "Managing Director"
firm: "Avidbank"
bio: "Conor Tidgwell is a Managing Director at Avidbank, a leading lender in the ETA search fund ecosystem. He appears frequently on Search Party to explain how the lending environment is evolving as more capital enters the ETA market and deal sizes grow. From SBA loan structures to the emergence of larger mid-market transactions, Conor provides lenders-eye intelligence that helps searchers and investors understand what debt capital looks like in today's market."
topics:
  - How ETA deal sizes are growing as more capital enters the market
  - The rise of holdcos and their impact on lender appetite
  - SBA loan structures commonly used in search fund acquisitions
  - What lenders look for when underwriting ETA deals
  - Larger versus traditional ETA transaction dynamics
  - How capital availability affects searcher behavior and strategy
  - Trends Avidbank is seeing across its ETA loan portfolio
episodeTitle: "As a Lender, Are You Seeing Larger ETA Search Deals More Often?"
episodeUrl: "https://searchpartychannel.substack.com/p/as-a-lender-are-you-seeing-larger"

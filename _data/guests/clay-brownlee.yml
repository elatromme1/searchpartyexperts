name: "Clay Brownlee"
title: "Partner"
firm: "Boulay"
bio: "Clay Brownlee is a Partner at Boulay, a professional services firm that is a long-time advisor to participants in the Entrepreneurship-Through-Acquisition market. He helps ETA searchers and new CEOs professionalize the finance and accounting function of acquired businesses, a critical step in building value and meeting investor reporting requirements post-close. Brownlee emphasizes that having the right financial infrastructure in place immediately after an acquisition is essential for driving growth and setting up a successful exit."
topics:
  - Post-close finance function professionalization
  - Accounting and reporting requirements for acquired businesses
  - Building financial infrastructure for ETA-backed companies
  - Outsourced versus internal finance teams post-acquisition
  - Investor and lender reporting obligations
  - Finance due diligence during the acquisition process
episodeTitle: "Post close, what should ETA searchers know about the finance function?"
episodeUrl: "https://searchpartychannel.substack.com/p/post-close-what-should-eta-searchers"

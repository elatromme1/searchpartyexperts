name: "Przemek Garbaczewski"
title: "Co-Founder"
firm: "Legacy Brothers Capital"
bio: "Przemek Garbaczewski is a Co-Founder of Legacy Brothers Capital, searching for a lower middle market business to acquire alongside his twin brother Bartosz. On Search Party, Przemek shares their goal of achieving ETA success in the United States before eventually deploying the model in Poland — where entrepreneurship through acquisition remains a relatively new concept with significant untapped potential. Their story represents the increasingly global appeal of the ETA model."
topics:
  - Conducting an ETA search in the US as international entrepreneurs
  - The potential for ETA as a value creation model in Poland and Eastern Europe
  - Twin brothers as ETA search partners and the dynamics that creates
  - Identifying acquisition targets in the lower middle market as a new entrant
  - What makes the US ETA ecosystem attractive to European entrepreneurs
  - Building credibility with sellers and investors as a first-generation searcher
  - Long-term vision for deploying ETA learnings across borders
episodeTitle: "Polish Twins Want ETA Success in the US Before Investing in Poland"
episodeUrl: "https://searchpartychannel.substack.com/p/polish-twins-want-eta-success-in"

name: "Raj Mahajan"
title: "Founder & CEO"
firm: "Jaan Capital"
bio: "Raj Mahajan is the Founder and CEO of Jaan Capital, a second-time entrepreneur-through-acquisition who has significantly evolved his approach after his first ETA experience. On Search Party, Raj shares candid lessons from his first acquisition and explains how a second-time buyer brings sharper deal discipline, stronger operator intuition, and a clearer vision of value creation. His journey illustrates how the ETA model rewards those willing to iterate and go again."
topics:
  - Lessons from a first ETA acquisition applied to a second search
  - What second-time searchers do differently in due diligence
  - Building conviction around a target business
  - Navigating investor relationships as a repeat searcher
  - Operational improvements that create measurable EBITDA gains
  - How the ETA community evolves with experience
episodeTitle: "A Second-Time ETA Has Upped His Game"
episodeUrl: "https://searchpartychannel.substack.com/p/a-second-time-eta-has-upped-his-game"

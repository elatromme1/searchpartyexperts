name: "Bartosz Garbaczewski"
title: "Co-Founder"
firm: "Legacy Brothers Capital"
bio: "Bartosz Garbaczewski is a Co-Founder of Legacy Brothers Capital, conducting an ETA search in the United States alongside his twin brother Przemek. On Search Party, Bartosz discusses their ambition to master the entrepreneurship through acquisition model in the US market before bringing those lessons back to Poland — where the lower middle market remains underserved by institutional buyers. Their journey reflects the growing international dimension of the ETA community."
topics:
  - ETA search strategy and deal sourcing as international entrepreneurs in the US
  - The vision for exporting the ETA model to Poland and Eastern Europe
  - Advantages and challenges of searching as identical twin co-founders
  - How the European business landscape differs from the US lower middle market
  - Building an investor network from scratch as a foreign-born searcher
  - Identifying industries and markets suited for ETA-style acquisitions in Europe
  - What success in the US search process will unlock for future ambitions abroad
episodeTitle: "Polish Twins Want ETA Success in the US Before Investing in Poland"
episodeUrl: "https://searchpartychannel.substack.com/p/polish-twins-want-eta-success-in"

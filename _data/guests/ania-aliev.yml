name: "Ania Aliev"
title: "CEO"
firm: "Life Support Systems"
bio: "Ania Aliev is the CEO of Life Support Systems, a company that services and maintains automated external defibrillators across the country. She completed her ETA search in just seven months — including closing a deal while eight months pregnant — and took over LSS when her son was twelve weeks old. On Search Party, Ania discusses how major life events don't have to derail an ETA search, and offers direct advice for women and parents navigating the acquisition journey."
topics:
  - Conducting an ETA search while pregnant
  - Managing seller relationships with transparency about personal circumstances
  - How pregnancy can serve as a filter for cultural fit with sellers
  - Overcoming self-doubt as a first-time female searcher
  - Why timing perfection is a myth in ETA search
  - Balancing parenthood and CEO responsibilities post-acquisition
  - The maturity advantages of becoming a parent during the search journey
episodeTitle: "Searching While Pregnant"
episodeUrl: "https://searchpartychannel.substack.com/p/searching-while-pregnant"

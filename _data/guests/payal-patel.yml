name: "Payal Patel"
title: "Senior Associate"
firm: "Kilpatrick Townsend & Stockton"
bio: "Payal Patel is a Senior Associate at Kilpatrick Townsend & Stockton, specializing in ETA and search fund transactions. On Search Party, she joins fellow Kilpatrick attorney Lauren Pierotti to explore how the emotional dimension of ETA deals — particularly the deep personal connection sellers have to businesses they have built over decades — shapes negotiation dynamics and deal structuring. Payal helps clients understand that respecting seller legacy is not just good ethics; it is good deal-making."
topics:
  - How sellers' emotional attachment to businesses affects deal negotiations
  - Legal strategies for preserving seller legacy during transition
  - Common issues that arise in lower middle market M&A due diligence
  - Structuring earnouts and seller rollover equity
  - Representing both buyers and sellers in search fund transactions
  - The role of legal counsel in managing closing risk
  - Post-close integration considerations from a legal standpoint
episodeTitle: "ETA Searchers Have Emotional Connection to Sellers — and That's a Good Thing"
episodeUrl: "https://searchpartychannel.substack.com/p/eta-searchers-have-emotional-connection-1b7"

name: "William Kuntz"
title: "Partner"
firm: "Next Coast Legacy"
bio: "William Kuntz is a Partner at Next Coast Legacy, an ETA private equity firm, where he focuses on lower-middle-market investments in the Business Process Outsourcing sector. He advises ETA searchers on how to evaluate BPO acquisition targets, with emphasis on revenue predictability, customer retention metrics, and concentration risk. Kuntz advocates for rigorous contract waterfall analysis before closing any deal and warns against BPO companies that compete on cost alone rather than niche specialization."
topics:
  - Evaluating BPO companies as ETA acquisition targets
  - Revenue predictability versus project-based revenue risks
  - Customer retention metrics and concentration risk
  - Contract waterfall analysis in due diligence
  - Gross margin benchmarks for lower-middle-market BPO businesses
  - AI disruption and integration in the BPO sector
episodeTitle: "Spotting 'Red Flags' in the Business Process Outsourcing Sector"
episodeUrl: "https://searchpartychannel.substack.com/p/spotting-red-flags-in-the-business"

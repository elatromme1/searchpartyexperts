name: "Chris Arrendale"
title: "Founder & Exited CEO"
firm: "CyberData Pros"
bio: "Chris Arrendale is the Founder and Exited CEO of CyberData Pros, the cybersecurity firm he built and subsequently sold to fellow ETA operator Keith Burns. As both founder and seller, Chris brings a unique dual perspective to Search Party — he understands the builder's pride in creating a specialized business and the operator's responsibility to ensure it continues to thrive under new ownership. His insights on cybersecurity risks for small businesses are grounded in years of hands-on experience protecting lower middle market companies."
topics:
  - Building a cybersecurity services business focused on small and mid-market companies
  - Transitioning leadership as a founder selling to an ETA operator
  - Common cybersecurity vulnerabilities in founder-led businesses
  - Why businesses underestimate their true cyber exposure and risk
  - Cybersecurity certifications that open doors to new revenue opportunities
  - How defense contractors and regulated industries are raising the bar for vendors
  - Protecting customer and client data in lower middle market environments
episodeTitle: "Without Cybersecurity, Small Businesses Can Get a Lot Smaller"
episodeUrl: "https://searchpartychannel.substack.com/p/without-cybersecurity-small-businesses"

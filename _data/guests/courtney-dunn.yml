name: "Courtney Dunn"
title: "VP Customer Success"
firm: "Cerbo"
bio: "Courtney Dunn is VP Customer Success at Cerbo, an electronic health records platform serving small healthcare practices. She conducted her ETA partner search with her husband and went through IVF during the search process, closing the deal on Cerbo before welcoming a daughter shortly after. On Search Party, Courtney shares her story of how pregnancy during search became an unexpected advantage — making her more relatable to target company employees and teaching her to lead with greater emotional intelligence."
topics:
  - Doing IVF while conducting an ETA search
  - How visible pregnancy can humanize an acquirer to nervous employees
  - Partner search dynamics between spouses
  - Life and timing considerations unique to female ETA searchers
  - Navigating hormonal and emotional challenges during due diligence
  - Why flexibility in the CEO role makes parenthood easier than corporate jobs
  - Choosing your hard as an entrepreneur and parent
episodeTitle: "Searching While Pregnant"
episodeUrl: "https://searchpartychannel.substack.com/p/searching-while-pregnant"

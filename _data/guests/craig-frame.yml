name: "Craig Frame"
title: "Partner"
firm: "Mayer Brown"
bio: "Craig Frame is a Partner at Mayer Brown, a global law firm, where he has worked extensively in the Entrepreneurship-Through-Acquisition market. He advises ETA searchers on how deal consideration structures are shaped by macroeconomic conditions, from fixed-price acquisitions in boom markets to earnout-heavy structures in down cycles. Frame also guides searchers on the tax implications of asset versus equity deal structures and the use of reps-and-warranties protections."
topics:
  - Deal consideration structures in ETA acquisitions
  - How economic conditions shape acquisition pricing
  - Earnouts and contingent consideration in down markets
  - Cash, rollover equity, and seller note trade-offs
  - Asset deals versus equity deals and tax implications
  - Reps and warranties in lower-middle-market transactions
  - Risk-appetite alignment between searchers and investors
episodeTitle: "What should an ETA searcher know about deal consideration structures?"
episodeUrl: "https://searchpartychannel.substack.com/p/what-should-an-eta-searcher-know-91d"

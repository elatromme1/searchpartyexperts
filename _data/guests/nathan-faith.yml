bio: "Nathan Faith is a Wealth Partner at Boulay, a firm that specializes in serving ETA searchers and small business owners with integrated financial planning. He is one of Search Party's most frequent guests, bringing practical tax, estate, and wealth-planning insights to entrepreneurs navigating the acquisition and ownership lifecycle. From residency planning to equity rollover decisions, Nathan explains how smart financial structuring can meaningfully change outcomes for searcher-CEOs."
topics:
  - Tax advantages of changing residency ahead of an acquisition
  - How much equity sellers should roll into an acquiring company
  - Whether searcher-CEOs should take out credit lines against equity value
  - Role of trusts in an ETA searcher's exit plan
  - Business sale tax strategies and timing
  - Investment account considerations for ETA operators
  - Wealth planning for first-time CEOs post-acquisition
episodeTitle: "Are there tax advantages to changing residency ahead of an acquisition?"

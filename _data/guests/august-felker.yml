name: "August Felker"
title: "CEO & Founder"
firm: "Oberle Risk Strategies"
bio: "August Felker is the CEO and Founder of Oberle Risk Strategies, a Search Party sponsor and one of the ETA ecosystem's most trusted insurance advisors. Having completed his own ETA search and acquisition of an insurance brokerage before founding Oberle, August brings the rare perspective of a searcher-turned-operator-turned-specialist. On Search Party, he walks through the insurance essentials every lower middle market acquirer must understand — from need-to-have coverages to the risks that catch new CEOs off guard."
topics:
  - Insurance essentials for lower middle market business acquisitions
  - Why acquired businesses are often dangerously underinsured
  - Need-to-have versus nice-to-have insurance policies for ETA CEOs
  - Cybersecurity insurance for small and mid-sized businesses
  - Directors and officers insurance in investor-backed companies
  - Professional liability and healthcare industry insurance risks
  - How insurance diligence reveals hidden risks in target businesses
episodeTitle: "What Forms of Insurance Are Essential for Lower Middle Market Businesses?"
episodeUrl: "https://searchpartychannel.substack.com/p/what-forms-of-insurance-are-essential-cd8"
